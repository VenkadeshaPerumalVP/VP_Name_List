<div class="app-wrapper">
  <!-- Top Glassmorphic Navigation Header -->
  <header class="app-header">
    <div class="header-container">
      <!-- Brand Logo -->
      <div class="brand-logo" routerLink="/dashboard">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <defs>
              <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="var(--accent-cyan)" />
                <stop offset="100%" stop-color="var(--accent-violet)" />
              </linearGradient>
            </defs>
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
            <line x1="3" x2="21" y1="9" y2="9"/>
            <line x1="9" x2="9" y1="21" y2="9"/>
          </svg>
        </div>
        <span class="brand-text">CardTrack</span>
      </div>

      <!-- Navigation Tabs -->
      <nav class="nav-tabs">
        <a class="nav-tab" routerLink="/dashboard" routerLinkActive="active-tab">
          Dashboard
        </a>
        <a class="nav-tab" routerLink="/name-cards" routerLinkActive="active-tab">
          Name Cards
        </a>
        <a class="nav-tab" routerLink="/weekly-tracker" routerLinkActive="active-tab">
          Weekly Tracker
        </a>
        <a class="nav-tab" routerLink="/new-numbers" routerLinkActive="active-tab">
          New Numbers
        </a>
      </nav>

      <!-- Excel Integration Controls -->
      <div class="header-actions">
        <!-- Hidden File Input for Excel Import -->
        <input 
          #fileInput 
          type="file" 
          (change)="onFileImport($event)" 
          accept=".xlsx, .xls" 
          style="display: none;" 
        />
        
        <button class="btn btn-secondary import-btn" (click)="triggerFileInput(fileInput)">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          Import
        </button>
        
        <button class="btn btn-cyan export-btn" (click)="onFileExport()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          Export
        </button>
      </div>
    </div>
  </header>

  <!-- Loading State Backdrop Overlay -->
  <div class="loading-overlay" *ngIf="!isDataLoaded">
    <div class="spinner-container">
      <div class="spinner"></div>
      <h3>Parsing Excel Database...</h3>
      <p>Please wait while we initialize the records</p>
    </div>
  </div>

  <!-- Main View Container -->
  <main class="app-main" *ngIf="isDataLoaded">
    <div class="container">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
